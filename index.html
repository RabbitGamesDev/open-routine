<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#09090B"/>
<title>OpenRutine — Tu OS personal</title>
<link rel="icon" type="image/svg+xml" href="logo.svg"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/tokens.css"/>
<link rel="stylesheet" href="css/base.css"/>
<link rel="stylesheet" href="css/components.css"/>
<link rel="stylesheet" href="css/animations.css"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="splash"><div style="text-align:center"><img src="assets/icon-192.png" alt=""/><p>Open<span>Rutine</span></p></div></div>

<aside id="sidebar">
  <div class="row" style="padding:1rem 1.1rem;gap:.7rem">
    <img src="assets/icon-192.png" style="width:36px;height:36px;border-radius:10px" alt=""/>
    <div><p class="bold" style="line-height:1">OpenRutine</p><p class="small muted" id="sb-date"></p></div>
  </div>
  <nav id="nav" style="flex:1;padding:.4rem .7rem;overflow-y:auto" aria-label="Módulos"></nav>
  <div style="padding:.9rem"><div class="card" style="padding:.8rem">
    <div class="row between"><p class="small muted">Sincronización</p><span class="pulse-dot" id="sync-dot"></span></div>
    <p class="small bold" id="sync-label" style="margin-top:.2rem">Local</p>
  </div></div>
</aside>
<div id="scrim"></div>

<div id="main">
  <header id="topbar">
    <button class="btn-g only-mobile" id="burger" aria-label="Menú"><i data-lucide="menu"></i></button>
    <h1 id="view-title" style="font-size:1.1rem;font-weight:800;letter-spacing:-.02em">Inicio</h1>
    <div class="row" style="margin-left:auto">
      <button class="btn-g" id="btn-add" title="Crear tarea"><i data-lucide="plus"></i></button>
      <a class="btn-g" href="#/ajustes" title="Ajustes"><i data-lucide="settings"></i></a>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav id="bottomnav" class="safe-b" aria-label="Navegación móvil"></nav>
<div id="modal-root"></div>
<div id="toasts" style="position:fixed;z-index:100;top:.8rem;right:.8rem;left:.8rem;max-width:380px;margin-left:auto;display:flex;flex-direction:column;gap:.6rem;pointer-events:none"></div>
<div id="onboarding-root"></div>

<script src="js/db.js"></script>
<script src="js/util.js"></script>
<script src="js/errors.js"></script>
<script src="js/ui.js"></script>
<script src="js/gamification.js"></script>
<script src="js/recurrence.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/seed.js"></script>
<script src="js/backup.js"></script>
<script src="js/sync.js"></script>
<script src="js/coach.js"></script>
<script src="js/views.js"></script>
<script src="js/router.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/app.js"></script>
</body>
</html>
